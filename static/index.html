<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RIO</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 680px; margin: 40px auto; padding: 0 20px; background: #0e0e10; color: #eee; }
  h1 { font-size: 28px; }
  button { font-size: 18px; padding: 14px 28px; margin: 8px 4px; border-radius: 12px; border: none; cursor: pointer; }
  #mic { background: #b91c1c; color: white; }
  #mic.recording { background: #16a34a; }
  #frame { background: #2563eb; color: white; }
  #observation { background: #1f1f23; padding: 16px; border-radius: 12px; margin-top: 20px; font-family: ui-monospace, monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
  audio { display: block; margin-top: 20px; width: 100%; }
</style>
</head>

<body>
<h1>RIO</h1>
<button id="mic">Hold to talk</button>
<video id="video" autoplay playsinline muted style="display:none;"></video>
<audio id="player" controls autoplay></audio>
<div id="observation">No observation yet.</div>


<script>
document.addEventListener('DOMContentLoaded', () => {
const micBtn = document.getElementById('mic');
const frameBtn = document.getElementById('frame');
const player = document.getElementById('player');
const obs = document.getElementById('observation');
let recorder, chunks;

async function startRec() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  recorder = new MediaRecorder(stream);
  chunks = [];
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = async () => {
    const blob = new Blob(chunks, { type: 'audio/webm' });
    const fd = new FormData();
    fd.append('audio', blob, 'rec.webm');
    const r = await fetch('/talk', { method: 'POST', body: fd });
    player.src = URL.createObjectURL(await r.blob());
    stream.getTracks().forEach(t => t.stop());
  };
  recorder.start();
  micBtn.classList.add('recording');
  micBtn.textContent = 'Release to send';
}
function stopRec() {
  if (recorder && recorder.state === 'recording') {
    recorder.stop();
    micBtn.classList.remove('recording');
    micBtn.textContent = 'Hold to talk';
  }
}
micBtn.addEventListener('mousedown', startRec);
micBtn.addEventListener('mouseup', stopRec);
micBtn.addEventListener('touchstart', e => { e.preventDefault(); startRec(); });
micBtn.addEventListener('touchend', e => { e.preventDefault(); stopRec(); });

frameBtn.addEventListener('click', async () => {
  obs.textContent = 'Capturing...';
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  const video = document.createElement('video');
  video.srcObject = stream;
  await video.play();
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  stream.getTracks().forEach(t => t.stop());
  canvas.toBlob(async blob => {
    obs.textContent = 'Analyzing...';
    const fd = new FormData();
    fd.append('image', blob, 'frame.jpg');
    const r = await fetch('/observe', { method: 'POST', body: fd });
    const j = await r.json();
    obs.textContent = j.observation || '(empty)';
  }, 'image/jpeg', 0.85);
});
});
</script>

<button id="frame" style="position:fixed;bottom:20px;right:20px;padding:14px 24px;background:#2563eb;color:white;border:none;border-radius:12px;cursor:pointer;font-size:16px;z-index:9999;">Send Webcam Frame</button>
<label for="upload" style="position:fixed;bottom:20px;right:230px;padding:14px 24px;background:#16a34a;color:white;border-radius:12px;cursor:pointer;font-size:16px;z-index:9999;">Upload Image/Video</label>
<input type="file" id="upload" accept="image/*,video/*" style="display:none">
<video id="preview" style="position:fixed;bottom:160px;right:20px;max-width:380px;max-height:240px;display:none;z-index:9999;background:#000;" controls></video>
<button id="grab" style="position:fixed;bottom:120px;right:20px;padding:10px 18px;background:#dc2626;color:white;border:none;border-radius:10px;cursor:pointer;font-size:14px;display:none;z-index:9999;">Grab This Frame</button>
<div id="observation" style="position:fixed;bottom:80px;right:20px;max-width:380px;background:#1f1f23;color:#eee;padding:12px;border-radius:8px;font-size:12px;font-family:monospace;display:none;white-space:pre-wrap;z-index:9999;"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const upload = document.getElementById('upload');
  const preview = document.getElementById('preview');
  const grabBtn = document.getElementById('grab');
  const obs = document.getElementById('observation');

  async function sendFrame(blob) {
    obs.style.display = 'block';
    obs.textContent = 'Analyzing...';
    const fd = new FormData();
    fd.append('image', blob, 'frame.jpg');
    const r = await fetch('/observe', { method: 'POST', body: fd });
    const j = await r.json();
    obs.textContent = j.observation || '(empty)';
  }

  upload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.type.startsWith('image/')) {
      sendFrame(file);
      preview.style.display = 'none';
      grabBtn.style.display = 'none';
    } else if (file.type.startsWith('video/')) {
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      grabBtn.style.display = 'block';
    }
  });

  grabBtn.addEventListener('click', () => {
    const cv = document.createElement('canvas');
    cv.width = preview.videoWidth;
    cv.height = preview.videoHeight;
    cv.getContext('2d').drawImage(preview, 0, 0);
    cv.toBlob(b => sendFrame(b), 'image/jpeg', 0.85);
  });

  let watcher = null;
  let inflight = false;
  preview.addEventListener('play', () => {
    if (watcher) clearInterval(watcher);
    watcher = setInterval(() => {
      if (preview.paused || preview.ended || inflight) return;
      inflight = true;
      const cv = document.createElement('canvas');
      cv.width = preview.videoWidth;
      cv.height = preview.videoHeight;
      cv.getContext('2d').drawImage(preview, 0, 0);
      cv.toBlob(async b => {
        try { await sendFrame(b); } finally { inflight = false; }
      }, 'image/jpeg', 0.85);
    }, 1500);
  });
  preview.addEventListener('pause', () => { if (watcher) clearInterval(watcher); });
  preview.addEventListener('ended', () => { if (watcher) clearInterval(watcher); });
});
</script>
</body>
</html>
